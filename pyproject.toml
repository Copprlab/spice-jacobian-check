[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spice-jacobian-check"
version = "0.1.0"
description = "Check ngspice AC transfers against central differences of DC operating points"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "Copprlab"}]
dependencies = []

[project.scripts]
spice-jacobian-check = "spice_jacobian_check.cli:main"

[tool.setuptools.packages.find]
include = ["spice_jacobian_check*"]
